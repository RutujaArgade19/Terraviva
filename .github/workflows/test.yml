name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run prepare:data
      - run: npm test
      - run: python3 test/stage-datasets.py
      - run: python3 test/reference-base.py
      - run: python3 test/reference-sqlite.py
      - run: python3 test/prepare-reference.py
      - run: npm run build


